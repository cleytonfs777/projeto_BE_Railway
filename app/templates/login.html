<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — BE</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --error: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .card {
            width: 100%;
            max-width: 360px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            text-align: center;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.8125rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-grid {
            display: grid;
            gap: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.375rem;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.625rem 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.9375rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 2.5rem;
        }

        .toggle-senha {
            position: absolute;
            top: 50%;
            right: 0.5rem;
            transform: translateY(-50%);
            background: none;
            border: none;
            margin: 0;
            padding: 0.25rem;
            width: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            cursor: pointer;
        }

        .toggle-senha:hover {
            background: none;
            color: var(--text);
        }

        .toggle-senha svg {
            width: 1.125rem;
            height: 1.125rem;
        }

        .toggle-senha .icon-off {
            display: none;
        }

        .toggle-senha.ativo .icon-on {
            display: none;
        }

        .toggle-senha.ativo .icon-off {
            display: block;
        }

        button {
            margin-top: 0.5rem;
            width: 100%;
            padding: 0.75rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .erro {
            background: #7f1d1d33;
            color: var(--error);
            border: 1px solid #7f1d1d;
            border-radius: 8px;
            padding: 0.625rem 0.75rem;
            font-size: 0.8125rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Registro de Gravação BE</h1>
        <p class="subtitle">Entre com suas credenciais para continuar</p>

        {% if erro %}
        <div class="erro">Usuário ou senha inválidos.</div>
        {% endif %}

        <form method="post" action="/login" class="form-grid">
            <div>
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div>
                <label for="senha">Senha</label>
                <div class="password-field">
                    <input type="password" id="senha" name="senha" required>
                    <button type="button" class="toggle-senha" id="toggle-senha" aria-label="Mostrar senha" aria-pressed="false">
                        <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit">Entrar</button>
        </form>
    </div>

    <script>
        const campoSenha = document.getElementById('senha');
        const botaoToggle = document.getElementById('toggle-senha');

        botaoToggle.addEventListener('click', () => {
            const visivel = campoSenha.type === 'text';
            campoSenha.type = visivel ? 'password' : 'text';
            botaoToggle.classList.toggle('ativo', !visivel);
            botaoToggle.setAttribute('aria-pressed', String(!visivel));
            botaoToggle.setAttribute('aria-label', visivel ? 'Mostrar senha' : 'Ocultar senha');
        });
    </script>
</body>
</html>
